<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ACT — Agent Control Tower">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#17242f"/>
      <stop offset="100%" stop-color="#0d1217"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0.35" y1="1" x2="0.9" y2="0.15">
      <stop offset="0%" stop-color="#35c7b4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#35c7b4" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="blip" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd889"/>
      <stop offset="100%" stop-color="#f2a93b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- app tile -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)" stroke="#26333f" stroke-width="2"/>

  <!-- radar rings -->
  <g fill="none" stroke="#f2a93b" stroke-width="7">
    <circle cx="256" cy="256" r="176" opacity="0.32"/>
    <circle cx="256" cy="256" r="118" opacity="0.52"/>
    <circle cx="256" cy="256" r="60" opacity="0.8"/>
  </g>

  <!-- crosshair ticks -->
  <g stroke="#f2a93b" stroke-width="4" opacity="0.22">
    <line x1="256" y1="66" x2="256" y2="446"/>
    <line x1="66" y1="256" x2="446" y2="256"/>
  </g>

  <!-- sweep afterglow wedge -->
  <path d="M256 256 L256 74 A182 182 0 0 1 413.6 165 Z" fill="url(#sweep)"/>
  <!-- sweep leading edge -->
  <line x1="256" y1="256" x2="413.6" y2="165" stroke="#35c7b4" stroke-width="6.5" stroke-linecap="round"/>

  <!-- blip -->
  <circle cx="360" cy="176" r="34" fill="url(#blip)"/>
  <circle cx="360" cy="176" r="9" fill="#ffd889"/>

  <!-- hub -->
  <circle cx="256" cy="256" r="15" fill="#f2a93b"/>
</svg>
