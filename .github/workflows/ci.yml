name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Both platforms, because a Linux-only run does not see the spawn layer of the platform ACT
  # actually ships to: a handful of tests in `CommandHostTests` and `AgentConfigFilesTests` return
  # early off Windows, and a dozen more (`WindowsArgument`, `ExecutableResolver`, the Codex
  # forwarder) assert whatever the running platform spells — so on ubuntu alone the cmd.exe shim,
  # PATHEXT resolution and argument quoting are verified nowhere.
  build-test:
    strategy:
      # Both legs finish: which platforms a failure reaches is the first thing worth knowing, and
      # fail-fast cancels exactly that answer.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1

  # A job of its own rather than more steps on the one above, for two reasons: the fast suite keeps
  # reporting in seconds instead of waiting behind a browser, and a red here is legible at a glance as
  # "the browser tier" rather than hiding in a log with 1800 unit tests. It costs one extra solution
  # build.
  #
  # One leg only, unlike `build-test`: this tier drives Blazor in Chromium, and nothing it asserts is
  # the host platform's — even the Windows clipboard is covered by synthesising the measured shape in
  # the browser (`Clipboard.cs`), which behaves the same either way. A second leg would pay another
  # Release build and another browser download to re-run the same assertions.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Built before the browser is installed, because the installer *is* a build artefact: the
      # Microsoft.Playwright package emits playwright.ps1 into the test project's output, which keeps the
      # browser version pinned to the package rather than to a separately-versioned CLI tool.
      - name: Build
        shell: pwsh
        run: |
          dotnet restore Act.slnx
          dotnet build Act.slnx -c Release --no-restore

      - name: Install Chromium
        shell: pwsh
        run: tests/Act.App.E2eTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Browser tests
        shell: pwsh
        run: ./scripts/build.ps1 -E2E -NoBuild
