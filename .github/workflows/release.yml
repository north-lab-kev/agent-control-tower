name: release

# Manual only: a release is a deliberate act, and the version is the operator's
# call — nothing here reacts to a push or a tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (ex: 1.2.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything that does not need Windows stays on Linux: Windows minutes bill at
  # 2x while the repo is private, so only the packaging job pays that.
  gate:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, so an already-released version fails before anything is built.
          fetch-depth: 0

      - name: Validate version and tag
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "Release Version '$env:VERSION' is not <major>.<minor>.<patch>[-prerelease] (ex: 1.2.3)."
          }

          if (git tag --list $env:TAG) {
              throw "Tag $env:TAG already exists; releases are never re-cut under the same version."
          }

      # Checked here rather than only where it is used: the stamp happens in the
      # Windows job, and a release that got that far to fail on a missing secret
      # would have paid for Windows minutes to learn it. Failing rather than
      # shipping without it is deliberate — an installer with no token sends
      # nothing, and a silent skip is how you find that out a month later.
      - name: Validate release secrets
        shell: pwsh
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:POSTHOG_PROJECT_TOKEN)) {
              throw "The POSTHOG_PROJECT_TOKEN secret is empty or not set. Add the project API key (phc_...) under Settings -> Secrets and variables -> Actions."
          }

          # The project API key is POST-only and safe to ship. A personal API key
          # (phx_) is not: it can read and delete, and it must never reach a client.
          if ($env:POSTHOG_PROJECT_TOKEN -notlike 'phc_*') {
              throw "POSTHOG_PROJECT_TOKEN does not look like a project API key (expected phc_...). A personal API key must never be shipped in the app."
          }

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1

  package:
    # Windows targets must be built on Windows (electron-builder cross-platform rule).
    runs-on: windows-latest
    needs: gate
    env:
      VERSION: ${{ inputs.version }}
    outputs:
      installer: ${{ steps.installer.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The key is not in the repo and never will be: `appsettings.json` ships an
      # empty one, so a fork or a build from source gets `NullTelemetrySink` and
      # points at nobody's project. Only a release carries a real value, stamped
      # into the checkout here and thrown away with the runner.
      #
      # It is written base64-encoded so the installer does not carry it in clear.
      # Be clear about what that is worth: it is obfuscation, not protection. A
      # PostHog *project* key is write-only by design — PostHog publishes it in the
      # script tag of every site that uses them — so there is nothing here to
      # defend, and base64 would not defend it. **Nothing that is genuinely secret
      # may be added to this step on the strength of it being encoded.**
      - name: Stamp the telemetry token
        shell: pwsh
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:POSTHOG_PROJECT_TOKEN)) {
              throw "The POSTHOG_PROJECT_TOKEN secret is empty or not set; refusing to package an installer that would send nothing."
          }

          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($env:POSTHOG_PROJECT_TOKEN))

          # Actions masks the secret itself, but not a transform of it. Registering
          # the encoded form keeps a later `set -x` or a stack trace from printing
          # what the raw value is masked to hide.
          Write-Host "::add-mask::$encoded"

          $path = 'src/Act.App/appsettings.json'
          $settings = Get-Content $path -Raw | ConvertFrom-Json

          $settings.Telemetry.ProjectToken = $encoded
          $settings | ConvertTo-Json -Depth 10 | Set-Content $path -Encoding utf8

          # Read back and decode rather than trust the write: a renamed section would
          # leave the key unset, and the installer would look perfectly healthy.
          $written = (Get-Content $path -Raw | ConvertFrom-Json).Telemetry
          $roundTripped = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($written.ProjectToken))

          if ($roundTripped -ne $env:POSTHOG_PROJECT_TOKEN) {
              throw "The telemetry token in $path does not decode back to the secret."
          }
          if (-not $written.Enabled) {
              throw "Telemetry is disabled in $path; the installer would ship with it off."
          }

          Write-Host "Telemetry token stamped (base64, $($encoded.Length) chars); host $($written.Host)."

      # -Version becomes $(Version): the SDK stamps it into
      # AssemblyInformationalVersion (what the running app reports) and
      # electron-builder names and versions the installer from it.
      - name: Package desktop (win-x64)
        shell: pwsh
        run: ./scripts/package-desktop.ps1 -Rid win-x64 -Version $env:VERSION

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $expected = "ACT-Setup-$env:VERSION-x64.exe"

          if (-not (Test-Path (Join-Path "artifacts/desktop/win-x64" $expected))) {
              $found = (Get-ChildItem "artifacts/desktop/win-x64" -Filter *.exe | ForEach-Object Name) -join ", "
              throw "Expected $expected in artifacts/desktop/win-x64; found: $found"
          }

          # Asserted for the same reason as the installer, and it matters more: an installer with no
          # `latest.yml` looks like a perfectly good release and silently strands every copy already
          # installed, because that file is the only thing they poll. It appears only while the
          # `publish` block is in `electron-builder.json`, so this is what catches its removal.
          if (-not (Test-Path "artifacts/desktop/win-x64/latest.yml")) {
              $found = (Get-ChildItem "artifacts/desktop/win-x64" | ForEach-Object Name) -join ", "
              throw "No latest.yml in artifacts/desktop/win-x64; auto-update would be dead on arrival. Found: $found"
          }

          "name=$expected" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: act-desktop-win-x64-${{ inputs.version }}
          # The blockmap and latest.yml travel with the installer: the release job decides whether
          # to publish them, and it cannot attach what was never carried across.
          path: |
            artifacts/desktop/win-x64/*.exe
            artifacts/desktop/win-x64/*.blockmap
            artifacts/desktop/win-x64/latest.yml
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      INSTALLER: ${{ needs.package.outputs.installer }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags: the release notes are a commit range.
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: act-desktop-win-x64-${{ inputs.version }}
          path: artifacts

      - name: Build release notes
        id: notes
        shell: pwsh
        run: |
          $previous = git tag --list 'v*' --sort=-v:refname | Select-Object -First 1
          $range = if ($previous) { "$previous..HEAD" } else { "HEAD" }
          $commits = @(git log $range --no-merges --pretty=format:'- %s (%h)')

          if (-not $commits) {
              $commits = @('- No commits since ' + $previous + '.')
          }

          $notes = @('## ACT ' + $env:TAG, '')
          $notes += 'Windows installer (win-x64, NSIS): `' + $env:INSTALLER + '`'
          $notes += ''
          $notes += '### Changes'
          $notes += ''
          $notes += $commits

          if ($previous) {
              $notes += ''
              $notes += '**Full changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/' + $previous + '...' + $env:TAG
          }

          $file = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes -join "`n" | Set-Content $file -Encoding utf8

          "path=$file" >> $env:GITHUB_OUTPUT

          Write-Host ($notes -join "`n")

      - name: Create tag
        shell: pwsh
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a $env:TAG -m "ACT $env:TAG"
          git push origin $env:TAG

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [string[]]$assets = @(Join-Path 'artifacts' $env:INSTALLER)

          [string[]]$prerelease = @()
          if ($env:VERSION -match '-') {
              $prerelease = @('--prerelease')
          }

          # **The update metadata ships on stable releases only.** electron-builder writes
          # `latest.yml` for every version — its channel comes from the publish config, not from the
          # `-beta.1` on the version — so excluding pre-releases is done here, by not attaching it.
          # A pre-release then carries the installer alone and no client can resolve an update from
          # it, which is belt-and-braces with the `AllowPrerelease = false` the app sets: GitHub's
          # `/releases/latest` already skips pre-releases, and this makes it moot if it ever did not.
          if ($prerelease) {
              Write-Host "Pre-release: publishing the installer only, no update metadata."
          }
          else {
              $assets += (Get-ChildItem 'artifacts' -Filter *.blockmap | ForEach-Object FullName)
              $assets += (Join-Path 'artifacts' 'latest.yml')
          }

          foreach ($asset in $assets) {
              if (-not (Test-Path $asset)) {
                  throw "Release asset $asset is missing from the downloaded artifact."
              }
          }

          Write-Host ("Publishing: " + (($assets | Split-Path -Leaf) -join ', '))

          gh release create $env:TAG `
              --title "ACT $env:TAG" `
              --notes-file '${{ steps.notes.outputs.path }}' `
              --verify-tag `
              @prerelease `
              @assets
